<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>Modellkontroll v2.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700&display=swap');

    :root {
      --bg: #f3f4f6; --surface: #ffffff; --surface2: #e5e7eb; --border: #d1d5db; 
      --ink: #111827; --muted: #6b7280; --blue: #1d4ed8; --blue-dim: #dbeafe;
      --green: #166534; --green-dim: #dcfce7; --yellow: #ca8a04; --yellow-dim: #fef08a;
      --red: #dc2626; --red-dim: #fee2e2;
      --mono: 'JetBrains Mono', monospace; --sans: 'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); height: 100%; display: flex; flex-direction: column; overflow: hidden; }

    /* Header og Toppmeny */
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-info h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header-info h1 .version { font-family: var(--mono); font-size: 11px; font-weight: normal; color: var(--muted); background: var(--bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
    .header-info p { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
    
    .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .toolbar select, .toolbar input, .btn { font-family: var(--sans); font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
    .toolbar input { cursor: text; }
    
    .btn { font-weight: 600; background: var(--surface2); transition: background 0.2s; }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--blue); color: white; border: none; }
    .btn-primary:hover { background: #1e40af; }
    
    /* Modellvelger Dropdown */
    .model-selector { position: relative; display: inline-block; }
    .model-dropdown { display: none; position: absolute; top: 100%; left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; min-width: 250px; max-height: 300px; overflow-y: auto; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 4px; padding: 8px; }
    .model-dropdown.show { display: flex; flex-direction: column; gap: 6px; }
    .model-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono); cursor: pointer; padding: 4px; border-radius: 4px; }
    .model-label:hover { background: var(--bg); }
    
    #signaturInfo { padding: 8px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: none; font-size: 12px; font-family: var(--mono); color: var(--ink); flex-wrap: wrap; gap: 10px; }
    #statusBar { font-family: var(--mono); font-size: 11px; padding: 4px 16px; background: var(--blue-dim); color: var(--blue); border-bottom: 1px solid var(--border); flex-shrink: 0; }

    main { flex: 1; overflow-y: auto; padding: 16px; }

    /* Trekkspill og Linjer */
    .kategori-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; overflow: hidden; page-break-inside: avoid; }
    .kategori-header { background: var(--surface2); padding: 10px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .kategori-header:hover { background: #d1d5db; }
    .kategori-body { display: none; flex-direction: column; }
    
    .punkt-container { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; background: var(--surface); gap: 10px; page-break-inside: avoid; }
    .punkt-tekst-tittel { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    
    /* Historikk-blokker */
    .historikk-blokk { background: var(--bg); border-left: 3px solid var(--muted); padding: 8px 12px; font-size: 12px; border-radius: 0 4px 4px 0; }
    .historikk-header { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; margin-bottom: 4px; color: var(--muted); }
    .historikk-status { font-weight: bold; }
    .historikk-status.ok { color: var(--green); }
    .historikk-status.info { color: var(--yellow); }
    .historikk-status.avvik { color: var(--red); }
    .historikk-kommentar { font-style: italic; margin-top: 4px; }
    
    /* Aktiv Fase inntasting */
    .aktiv-fase-boks { border: 1px solid var(--blue-dim); background: #f8fafc; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-left: 3px solid var(--blue); }
    .fase-tittel { font-size: 11px; font-family: var(--mono); color: var(--blue); font-weight: bold; text-transform: uppercase; }
    
    .input-rad { display: flex; gap: 10px; align-items: flex-start; }
    .status-velger { font-size: 12px; font-family: var(--sans); padding: 6px; border: 1px solid var(--border); border-radius: 4px; outline: none; min-width: 220px; }
    .punkt-kommentar { font-size: 12px; font-family: var(--sans); padding: 6px; border: 1px solid var(--border); border-radius: 4px; flex: 1; min-height: 30px; resize: vertical; }
    .validering-feil { border: 2px solid var(--red) !important; background-color: var(--red-dim) !important; }
    
    .kamera-btn { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; font-size: 11px; font-family: var(--mono); cursor: pointer; transition: 0.2s; flex-shrink: 0; }
    .kamera-btn:hover { background: var(--surface2); }
    
    /* Bildegalleri */
    .bilde-galleri { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .bilde-galleri img { height: 120px; border: 1px solid var(--border); border-radius: 4px; object-fit: cover; cursor: pointer; }
    .bilde-galleri img:hover { opacity: 0.8; }
  </style>
</head>
<body>

<header>
  <div class="header-info">
    <h1>Modellkontroll <span class="version">v2.0</span></h1>
    <p>Sporing av avvik og utbedring i BIM</p>
  </div>
  <div>
    <span id="syncStatus" style="font-size:11px; font-family:var(--mono); font-weight:bold; color:var(--green); margin-right:10px;">🟢 Lese-modus</span>
    <button class="btn btn-primary" onclick="lagreTilProsjekt()">☁️ Lagre prosjektfil</button>
  </div>
</header>

<div class="toolbar">
  <select id="fagFilter" onchange="byttFag(this.value)">
    <option value="">Laster fag...</option>
  </select>
  
  <div style="border-left: 1px solid var(--border); height: 24px; margin: 0 5px;"></div>
  
  <!-- Valg av kontrollfase -->
  <select id="faseFilter" onchange="byttFase(this.value)" style="font-weight: 600; color: var(--blue);">
    <option value="Egenkontroll">1. Egenkontroll</option>
    <option value="Oppretting Egen">2. Oppretting etter Egenkontroll</option>
    <option value="Fagkontroll">3. Fagkontroll</option>
    <option value="Oppretting Fag">4. Oppretting etter Fagkontroll</option>
  </select>
  
  <!-- Valg av modeller -->
  <div class="model-selector">
    <button class="btn" id="modelBtn" onclick="toggleModelDropdown()">📦 Velg modeller i visning ▼</button>
    <div id="modelDropdown" class="model-dropdown">
      <label class="model-label" style="font-weight:bold; border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:4px;">
        <input type="checkbox" id="checkAllModels" onchange="toggleAlleModeller(this)"> Merk alle modeller
      </label>
      <div id="modelList">
        <span style="font-size:10px; color:var(--muted);">Laster modeller fra Trimble...</span>
      </div>
    </div>
  </div>
  
  <div style="border-left: 1px solid var(--border); height: 24px; margin: 0 5px;"></div>
  
  <input type="text" id="brukerInitialer" placeholder="Initialer" style="width:70px;">
  <button class="btn" id="signerBtn" onclick="signerFase()">✍️ Signer aktiv fase</button>
  
  <div style="border-left: 1px solid var(--border); height: 24px; margin: 0 5px;"></div>
  
  <button class="btn" onclick="eksporterPDF()">📄 Eksporter til PDF</button>
</div>

<div id="signaturInfo"></div>
<div id="statusBar">Venter på tilkobling...</div>

<main id="exportContainer">
  <div id="listeInnhold"></div>
</main>

<script>
let API = null;
let strukturData = null; 
let valgtFag = '';
let aktivFase = 'Egenkontroll';
let tilgjengeligeModeller = []; // Modeller fra API
let valgteModeller = []; // Modeller huket av

// Definerte faser for historikk-håndtering
const faseRekkefolge = ['Egenkontroll', 'Oppretting Egen', 'Fagkontroll', 'Oppretting Fag'];

// ksData struktureres nå slik: ksData[punktId][faseNavn] = { status, kommentar, bilder: [] }
let ksData = {};         
let signaturData = {}; 

const $ = id => document.getElementById(id);
const setStatus = m => { $('statusBar').textContent = m; };

async function init() {
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    setStatus('✅ Tilkoblet Trimble Connect Workspace API');
    hentModeller();
  } catch(e) {
    setStatus('⚠️ Kjører frittstående (Utenfor Trimble 3D-visning)');
    // Mock modeller
    tilgjengeligeModeller = [{id: 'm1', name: 'Veg_Hovedmodell.ifc'}, {id: 'm2', name: 'Rekkverk_E6.ifc'}];
    tegnModellListe();
  }
  
  try {
    const response = await fetch('sjekklister.json');
    if (!response.ok) throw new Error("Nettverksrespons var ikke OK");
    strukturData = await response.json();
    
    // Sett opp fag-meny
    const select = $('fagFilter');
    select.innerHTML = '';
    for (const fagNokkel in strukturData) {
      const opt = document.createElement('option');
      opt.value = fagNokkel;
      opt.innerText = strukturData[fagNokkel].navn;
      select.appendChild(opt);
    }
    
    if (Object.keys(strukturData).length > 0) {
      valgtFag = Object.keys(strukturData)[0];
      byggDataStruktur();
      tegnKategorier();
    }
  } catch(e) {
    setStatus('❌ Kunne ikke laste sjekklister.json.');
  }
}

async function hentModeller() {
  try {
    const models = await API.viewer.getModels();
    tilgjengeligeModeller = models.map(m => ({ id: m.modelId || m.id, name: m.name }));
    tegnModellListe();
  } catch(e) {
    console.error("Kunne ikke hente modeller", e);
  }
}

function tegnModellListe() {
  const container = $('modelList');
  container.innerHTML = '';
  
  if(tilgjengeligeModeller.length === 0) {
    container.innerHTML = '<span style="font-size:10px;">Ingen modeller funnet i visningen.</span>';
    return;
  }
  
  tilgjengeligeModeller.forEach(m => {
    const isChecked = valgteModeller.includes(m.id) ? 'checked' : '';
    const label = document.createElement('label');
    label.className = 'model-label';
    label.innerHTML = `<input type="checkbox" value="${m.id}" onchange="oppdaterValgteModeller()" ${isChecked}> <span title="${m.name}">${m.name}</span>`;
    container.appendChild(label);
  });
}

function toggleModelDropdown() {
  $('modelDropdown').classList.toggle('show');
}

function toggleAlleModeller(masterCheckbox) {
  const checkboxes = $('modelList').querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
  oppdaterValgteModeller();
}

function oppdaterValgteModeller() {
  const checkboxes = $('modelList').querySelectorAll('input[type="checkbox"]');
  valgteModeller = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
  $('modelBtn').innerText = `📦 Modeller (${valgteModeller.length} valgt) ▼`;
  $('syncStatus').innerText = '🟠 Ulagrede endringer';
}

function lukkModelDropdown(e) {
  if (!$('modelBtn').contains(e.target) && !$('modelDropdown').contains(e.target)) {
    $('modelDropdown').classList.remove('show');
  }
}
document.addEventListener('click', lukkModelDropdown);

function byttFag(fagNokkel) {
  valgtFag = fagNokkel;
  byggDataStruktur();
  tegnKategorier();
}

function byttFase(fase) {
  aktivFase = fase;
  
  // Modeller låses etter Egenkontroll for å sikre konsistens
  const modelBtn = $('modelBtn');
  if (aktivFase !== 'Egenkontroll') {
    modelBtn.disabled = true;
    modelBtn.innerText = `🔒 Modeller låst (${valgteModeller.length} valgt)`;
    modelBtn.style.opacity = '0.7';
  } else {
    modelBtn.disabled = false;
    modelBtn.innerText = `📦 Velg modeller i visning ▼`;
    modelBtn.style.opacity = '1';
    oppdaterValgteModeller(); // Oppdaterer teksten med antall
  }
  
  $('signerBtn').innerText = `✍️ Signer ${aktivFase}`;
  tegnKategorier(); // Tegn grensesnittet på nytt med riktig fase åpen
}

// Sikrer at alle punkter eksisterer i datastrukturen for alle faser
function byggDataStruktur() {
  const kat = strukturData[valgtFag].kategorier;
  kat.forEach(k => {
    k.punkter.forEach(pkt => {
      if (!ksData[pkt.id]) ksData[pkt.id] = {};
      faseRekkefolge.forEach(f => {
        if (!ksData[pkt.id][f]) {
          ksData[pkt.id][f] = { status: '', kommentar: '', bilder: [] };
        }
      });
    });
  });
}

// Konverterer statuskode til lesbar tekst og farge
function getStatusFormat(kode) {
  switch(kode) {
    case 'OK': return { tekst: 'Ingen avvik, OK', css: 'ok', fargeValg: '#dcfce7' };
    case 'INFO': return { tekst: 'Ingen avvik, forbedringsforslag', css: 'info', fargeValg: '#fef08a' };
    case 'AVVIK': return { tekst: 'Avvik funnet, må rettes', css: 'avvik', fargeValg: '#fee2e2' };
    default: return { tekst: 'Ikke vurdert', css: '', fargeValg: 'var(--bg)' };
  }
}

function tegnKategorier() {
  const main = $('listeInnhold');
  main.innerHTML = '';
  const kategorier = strukturData[valgtFag].kategorier;

  kategorier.forEach(kat => {
    const panel = document.createElement('div');
    panel.className = 'kategori-panel';
    
    const header = document.createElement('div');
    header.className = 'kategori-header';
    header.innerHTML = `<span>▶ ${kat.navn}</span> <span style="font-family:var(--mono); color:var(--muted); font-size:11px;">${kat.punkter.length} punkter</span>`;
    
    const body = document.createElement('div');
    body.className = 'kategori-body';

    kat.punkter.forEach((pkt, index) => {
      const pktContainer = document.createElement('div');
      pktContainer.className = 'punkt-container';
      
      // Tittel for sjekkpunktet
      const tittel = document.createElement('div');
      tittel.className = 'punkt-tekst-tittel';
      tittel.innerText = `${index + 1}. ${pkt.tekst}`;
      pktContainer.appendChild(tittel);

      const faseIndex = faseRekkefolge.indexOf(aktivFase);
      
      // 1. TEGN HISTORIKK FOR TIDLIGERE FASER
      faseRekkefolge.forEach((faseNavn, i) => {
        if (i < faseIndex) {
          const historikkData = ksData[pkt.id][faseNavn];
          if (historikkData && historikkData.status !== '') {
            const histBlokk = document.createElement('div');
            histBlokk.className = 'historikk-blokk';
            
            const format = getStatusFormat(historikkData.status);
            
            let html = `
              <div class="historikk-header">
                <span>Fase: ${faseNavn}</span>
                <span class="historikk-status ${format.css}">${format.tekst}</span>
              </div>
            `;
            if (historikkData.kommentar) html += `<div class="historikk-kommentar">«${historikkData.kommentar}»</div>`;
            
            if (historikkData.bilder && historikkData.bilder.length > 0) {
              html += `<div class="bilde-galleri" style="margin-top:8px;">`;
              historikkData.bilder.forEach(b64 => {
                html += `<img src="${b64}" onclick="window.open('${b64}', '_blank')">`;
              });
              html += `</div>`;
            }
            histBlokk.innerHTML = html;
            pktContainer.appendChild(histBlokk);
          }
        }
      });

      // 2. TEGN INPUT FOR AKTIV FASE
      const aktivData = ksData[pkt.id][aktivFase];
      const aktivBlokk = document.createElement('div');
      aktivBlokk.className = 'aktiv-fase-boks';
      
      aktivBlokk.innerHTML = `
        <div class="fase-tittel">Redigerer nå: ${aktivFase}</div>
        <div class="input-rad">
          <select class="status-velger" id="status_${pkt.id}">
            <option value="">- Velg status for funn -</option>
            <option value="OK" ${aktivData.status === 'OK' ? 'selected' : ''}>Ingen avvik, OK</option>
            <option value="INFO" ${aktivData.status === 'INFO' ? 'selected' : ''}>Ingen avvik, forbedringsforslag</option>
            <option value="AVVIK" ${aktivData.status === 'AVVIK' ? 'selected' : ''}>Avvik funnet, må rettes</option>
          </select>
          
          <textarea class="punkt-kommentar" id="komm_${pkt.id}" placeholder="Skriv din kommentar her...">${aktivData.kommentar}</textarea>
          
          <button class="kamera-btn" onclick="taBilde('${pkt.id}')">📷 Legg til bilde</button>
        </div>
        <div class="bilde-galleri" id="galleri_${pkt.id}"></div>
      `;
      pktContainer.appendChild(aktivBlokk);
      body.appendChild(pktContainer);

      // DOM-håndtering etter innsetting
      setTimeout(() => {
        oppdaterGalleriUI(pkt.id); // Viser allerede lagrede bilder
        
        const sel = $(`status_${pkt.id}`);
        const kom = $(`komm_${pkt.id}`);
        
        const sjekkValidering = () => {
          if ((sel.value === 'AVVIK' || sel.value === 'INFO') && kom.value.trim() === '') {
            kom.classList.add('validering-feil');
          } else {
            kom.classList.remove('validering-feil');
          }
          sel.style.backgroundColor = getStatusFormat(sel.value).fargeValg;
        };
        
        sel.addEventListener('change', (e) => {
          ksData[pkt.id][aktivFase].status = e.target.value;
          sjekkValidering();
          $('syncStatus').innerText = '🟠 Ulagrede endringer';
        });
        
        kom.addEventListener('input', (e) => {
          ksData[pkt.id][aktivFase].kommentar = e.target.value;
          sjekkValidering();
          $('syncStatus').innerText = '🟠 Ulagrede endringer';
        });
        
        sjekkValidering();
      }, 0);
    });

    panel.appendChild(header);
    panel.appendChild(body);
    main.appendChild(panel);

    header.addEventListener('click', () => {
      const isOpen = body.style.display === 'flex';
      body.style.display = isOpen ? 'none' : 'flex';
      header.querySelector('span').innerText = `${isOpen ? '▶' : '▼'} ${kat.navn}`;
    });
  });
}

function validerAktivFase() {
  let harFeil = false;
  for (const id in ksData) {
    const data = ksData[id][aktivFase];
    if (data && (data.status === 'AVVIK' || data.status === 'INFO') && data.kommentar.trim() === '') {
      const felt = $(`komm_${id}`);
      if (felt) felt.classList.add('validering-feil');
      harFeil = true;
    }
  }
  return !harFeil;
}

// Bildehåndtering med støtte for array
async function taBilde(punktId) {
  try {
    let base64;
    if (API && API.viewer && typeof API.viewer.getSnapshot === 'function') {
      base64 = await API.viewer.getSnapshot();
    } else {
      // Fallback
      const canvas = document.createElement('canvas');
      canvas.width = 300; canvas.height = 150;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0,0,300,150);
      ctx.fillStyle = '#0f172a'; ctx.font = '12px sans-serif'; 
      ctx.fillText(`Snap: ${new Date().toLocaleTimeString()}`, 90, 80);
      base64 = canvas.toDataURL();
    }
    
    // Legg bildet til i arrayen for aktiv fase
    ksData[punktId][aktivFase].bilder.push(base64);
    oppdaterGalleriUI(punktId);
    
    $('syncStatus').innerText = '🟠 Ulagrede endringer';
    setStatus(`📷 Bilde lagt til under ${aktivFase}.`);
  } catch (e) {
    console.error("Feil ved bilde", e);
    alert("Kunne ikke ta bilde: " + e.message);
  }
}

function oppdaterGalleriUI(punktId) {
  const galleri = $(`galleri_${punktId}`);
  if(!galleri) return;
  galleri.innerHTML = '';
  const bilder = ksData[punktId][aktivFase].bilder || [];
  
  bilder.forEach((b64, imgIndex) => {
    const img = document.createElement('img');
    img.src = b64;
    img.title = "Klikk for å fjerne bilde";
    img.onclick = () => {
      if(confirm("Slette dette bildet?")) {
        ksData[punktId][aktivFase].bilder.splice(imgIndex, 1);
        oppdaterGalleriUI(punktId);
        $('syncStatus').innerText = '🟠 Ulagrede endringer';
      }
    };
    galleri.appendChild(img);
  });
}

function signerFase() {
  const initialer = $('brukerInitialer').value.trim();
  if (!initialer) {
    alert("Vennligst skriv inn initialene dine i tekstfeltet før du signerer.");
    return;
  }
  const dato = new Date().toLocaleString('no-NB', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  
  signaturData[aktivFase] = { initialer: initialer, dato: dato };
  oppdaterSignaturVisning();
  $('syncStatus').innerText = '🟠 Ulagrede endringer';
  setStatus(`✍️ Signert for fasen: ${aktivFase}.`);
}

function oppdaterSignaturVisning() {
  const boks = $('signaturInfo');
  boks.innerHTML = '';
  
  let harSignaturer = false;
  faseRekkefolge.forEach(fase => {
    if (signaturData[fase]) {
      const sp = document.createElement('span');
      sp.innerHTML = `✅ <strong>${fase}:</strong> ${signaturData[fase].initialer} (${signaturData[fase].dato})`;
      boks.appendChild(sp);
      harSignaturer = true;
    }
  });
  
  boks.style.display = harSignaturer ? 'flex' : 'none';
}

function eksporterPDF() {
  if (!validerAktivFase()) {
    alert("Du mangler kommentar på noen punkter med avvik. Fyll ut røde felt før eksport.");
    return;
  }

  // Åpne alle faner for print
  document.querySelectorAll('.kategori-body').forEach(el => el.style.display = 'flex');
  document.querySelectorAll('.kategori-header span:first-child').forEach(el => {
    el.innerText = el.innerText.replace('▶', '▼');
  });

  const element = $('exportContainer');
  const fagNavn = $('fagFilter').options[$('fagFilter').selectedIndex]?.text || "Eksport";
  const dato = new Date().toISOString().slice(0, 10);
  const rensFaseNavn = aktivFase.replace(/\s+/g, '');
  
  const opt = {
    margin:       [15, 10, 15, 10], 
    filename:     `Modellkontroll_${fagNavn}_${rensFaseNavn}_${dato}.pdf`,
    image:        { type: 'jpeg', quality: 0.95 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  setStatus('⏳ Genererer PDF... Dette kan ta litt tid pga bildene.');
  html2pdf().set(opt).from(element).save().then(() => {
    setStatus('✅ PDF generert og lagt i nedlastinger.');
  });
}

function lagreTilProsjekt() {
  if (!validerAktivFase()) {
    alert("Du mangler kommentar på noen punkter med avvik. Fyll ut røde felt før lagring.");
    return;
  }
  if (aktivFase === 'Egenkontroll' && valgteModeller.length === 0) {
    if(!confirm("Du har ikke valgt noen modeller. Vil du lagre likevel?")) return;
  }

  $('syncStatus').innerText = '⏳ Synkroniserer...';
  
  const eksportData = {
    metadata: {
      fag: $('fagFilter').value,
      sistOppdatertFase: aktivFase,
      dato: new Date().toISOString(),
      modeller: valgteModeller,
      signaturer: signaturData
    },
    kontrollData: ksData
  };
  
  setTimeout(() => {
    $('syncStatus').innerText = `🟢 Synkronisert (Sist lagret: ${aktivFase})`;
    setStatus(`Prosjektfil er klargjort for Trimble lagring.`);
    console.log("JSON som vil bli skrevet til Trimble:", eksportData);
  }, 1200);
}

init();
</script>
