<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>KS-Verktøy Trimble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700&display=swap');

    :root {
      --bg: #f3f4f6; --surface: #ffffff; --surface2: #e5e7eb; --border: #d1d5db; 
      --ink: #111827; --muted: #6b7280; --blue: #1d4ed8; --blue-dim: #dbeafe;
      --mono: 'JetBrains Mono', monospace; --sans: 'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); height: 100%; display: flex; flex-direction: column; overflow: hidden; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-info h1 { font-size: 16px; font-weight: 700; }
    .header-info p { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
    
    .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 15px; align-items: center; flex-shrink: 0; }
    .toolbar select, .btn { font-family: var(--sans); font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
    .btn { font-weight: 600; background: var(--surface2); transition: background 0.2s; }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--blue); color: white; border: none; }
    .btn-primary:hover { background: #1e40af; }

    #statusBar { font-family: var(--mono); font-size: 11px; padding: 4px 16px; background: var(--blue-dim); color: var(--blue); border-bottom: 1px solid var(--border); }

    main { flex: 1; overflow-y: auto; padding: 16px; }

    /* Trekkspill-kategorier (Accordion) */
    .kategori-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
    .kategori-header { background: var(--surface2); padding: 10px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .kategori-header:hover { background: #d1d5db; }
    .kategori-body { display: none; flex-direction: column; }
    
    /* Enkeltlinje-designet */
    .punkt-container { border-top: 1px solid var(--border); padding: 8px 14px; display: flex; flex-direction: column; background: var(--surface); }
    .punkt-rad { display: grid; grid-template-columns: 140px 1fr 200px 32px; gap: 12px; align-items: center; }
    
    .status-velger { font-size: 11px; font-family: var(--mono); padding: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); }
    .status-velger.egenkontroll { background: #fef08a; border-color: #ca8a04; }
    .status-velger.fagkontroll { background: #dcfce7; border-color: #166534; }
    .status-velger.ir { background: #f3f4f6; color: #9ca3af; text-decoration: line-through; }
    
    .punkt-tekst { font-size: 12px; line-height: 1.4; }
    .punkt-kommentar { font-size: 11px; font-family: var(--sans); padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; width: 100%; }
    
    .kamera-btn { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.6; transition: opacity 0.2s; }
    .kamera-btn:hover { opacity: 1; }
    
    .bilde-ramme { margin-top: 8px; display: none; border-left: 2px solid var(--blue); padding-left: 10px; }
    .bilde-ramme img { max-height: 200px; border: 1px solid var(--border); border-radius: 4px; }
    
    .cloud-sync { font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--green); font-family: var(--mono); font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div class="header-info">
    <h1>Kvalitetskontroll BIM</h1>
    <p>Prosjektoppsett</p>
  </div>
  <div class="cloud-sync">
    <span id="syncStatus">🟢 Lese-modus</span>
    <button class="btn btn-primary" onclick="lagreTilProsjekt()">☁️ Lagre til Trimble</button>
  </div>
</header>

<div class="toolbar">
  <select id="fagFilter">
    <option value="">Laster fag...</option>
  </select>
  <button class="btn" onclick="eksporterKort()">📄 Forenklet PDF</button>
</div>

<div id="statusBar">Venter på tilkobling...</div>

<main id="listeInnhold">
  </main>

<script>
let API = null;
let strukturData = null; // Holder data fra sjekklister.json
let ksData = {};         // Holder status, kommentarer og bilder for punktene

const $ = id => document.getElementById(id);
const setStatus = m => { $('statusBar').textContent = m; };

async function init() {
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    setStatus('✅ Tilkoblet Trimble Connect Workspace');
  } catch(e) {
    setStatus('⚠️ Kjører frittstående (Utenfor Trimble)');
  }
  
  // Last inn JSON-struktur
  try {
    const response = await fetch('sjekklister.json');
    strukturData = await response.json();
    oppdaterFagDropdown();
  } catch(e) {
    setStatus('❌ Kunne ikke laste sjekklister.json. Sjekk at den ligger i samme mappe.');
  }
}

function oppdaterFagDropdown() {
  const select = $('fagFilter');
  select.innerHTML = '';
  for (const fagNokkel in strukturData) {
    const opt = document.createElement('option');
    opt.value = fagNokkel;
    opt.innerText = strukturData[fagNokkel].navn;
    select.appendChild(opt);
  }
  // Lytt på endringer
  select.addEventListener('change', (e) => tegnKategorier(e.target.value));
  // Tegn første fag
  if (Object.keys(strukturData).length > 0) {
    tegnKategorier(Object.keys(strukturData)[0]);
  }
}

function tegnKategorier(fagNokkel) {
  const main = $('listeInnhold');
  main.innerHTML = '';
  const kategorier = strukturData[fagNokkel].kategorier;

  kategorier.forEach(kat => {
    const panel = document.createElement('div');
    panel.className = 'kategori-panel';
    
    // Header for trekkspill
    const header = document.createElement('div');
    header.className = 'kategori-header';
    header.innerHTML = `<span>▶ ${kat.navn}</span> <span style="font-family:var(--mono); color:var(--muted); font-size:11px;">${kat.punkter.length} punkter</span>`;
    
    const body = document.createElement('div');
    body.className = 'kategori-body';

    // Tegn selve linjene (punktene)
    kat.punkter.forEach(pkt => {
      // Sørg for at punktet finnes i ksData for lagring av tilstand
      if (!ksData[pkt.id]) ksData[pkt.id] = { status: 'Ubehandlet', kommentar: '', bilde: null };
      const lagret = ksData[pkt.id];

      const pktContainer = document.createElement('div');
      pktContainer.className = 'punkt-container';

      pktContainer.innerHTML = `
        <div class="punkt-rad">
          <select class="status-velger" id="status_${pkt.id}">
            <option value="Ubehandlet" ${lagret.status === 'Ubehandlet' ? 'selected' : ''}>- Ikke vurdert -</option>
            <option value="IR" ${lagret.status === 'IR' ? 'selected' : ''}>Ikke relevant</option>
            <option value="Egenkontroll" ${lagret.status === 'Egenkontroll' ? 'selected' : ''}>Egenkontroll OK</option>
            <option value="Fagkontroll" ${lagret.status === 'Fagkontroll' ? 'selected' : ''}>Fagkontroll OK</option>
          </select>
          
          <div class="punkt-tekst">${pkt.tekst}</div>
          
          <input type="text" class="punkt-kommentar" id="komm_${pkt.id}" placeholder="Kommentar..." value="${lagret.kommentar}">
          
          <button class="kamera-btn" onclick="taBilde('${pkt.id}')" title="Ta skjermbilde fra 3D">📷</button>
        </div>
        
        <div class="bilde-ramme" id="ramme_${pkt.id}" style="display: ${lagret.bilde ? 'block' : 'none'};">
          <img id="bilde_${pkt.id}" src="${lagret.bilde || ''}">
        </div>
      `;
      body.appendChild(pktContainer);
    });

    // Event listeners for å oppdatere state og farger dynamisk (settes etter HTML er lagt til DOM)
    panel.appendChild(header);
    panel.appendChild(body);
    main.appendChild(panel);

    // Trekkspill-logikk
    header.addEventListener('click', () => {
      const isOpen = body.style.display === 'flex';
      body.style.display = isOpen ? 'none' : 'flex';
      header.querySelector('span').innerText = `${isOpen ? '▶' : '▼'} ${kat.navn}`;
    });

    // Logikk for inputfelt
    kat.punkter.forEach(pkt => {
      const sel = $(`status_${pkt.id}`);
      const oppdaterFarge = () => {
        sel.className = 'status-velger';
        if (sel.value === 'Egenkontroll') sel.classList.add('egenkontroll');
        if (sel.value === 'Fagkontroll') sel.classList.add('fagkontroll');
        if (sel.value === 'IR') sel.classList.add('ir');
        ksData[pkt.id].status = sel.value;
        $('syncStatus').innerText = '🟠 Ulagrede endringer';
      };
      
      sel.addEventListener('change', oppdaterFarge);
      oppdaterFarge(); // Sett farge ved innlasting

      $(`komm_${pkt.id}`).addEventListener('input', (e) => {
        ksData[pkt.id].kommentar = e.target.value;
        $('syncStatus').innerText = '🟠 Ulagrede endringer';
      });
    });
  });
}

async function taBilde(punktId) {
  const ramme = $(`ramme_${punktId}`);
  const img = $(`bilde_${punktId}`);
  
  try {
    if (API && API.viewer) {
      const base64 = await API.viewer.getScreenshot();
      img.src = base64;
      ramme.style.display = 'block';
      ksData[punktId].bilde = base64;
      $('syncStatus').innerText = '🟠 Ulagrede endringer';
      setStatus(`📷 Bilde lagret for punkt.`);
    } else {
      throw new Error("Mangler Trimble API");
    }
  } catch (e) {
    // Fallback for lokal testing
    const canvas = document.createElement('canvas');
    canvas.width = 400; canvas.height = 200;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0,0,400,200);
    ctx.fillStyle = '#0f172a'; ctx.font = '14px sans-serif'; ctx.fillText('Demo: Bilde fra 3D-visning', 110, 105);
    
    img.src = canvas.toDataURL();
    ramme.style.display = 'block';
    ksData[punktId].bilde = img.src;
    $('syncStatus').innerText = '🟠 Ulagrede endringer';
  }
}

function lagreTilProsjekt() {
  // Her vil Trimble File API (eller Extension API) koden implementeres for å skrive ksData til skyen.
  // Som demonstrasjon simulerer vi en opplasting.
  $('syncStatus').innerText = '⏳ Synkroniserer...';
  setTimeout(() => {
    $('syncStatus').innerText = '🟢 Synkronisert med Trimble';
    setStatus('Skjema lagret til skyen (Simulert)');
    console.log("Data som sendes til Trimble:", JSON.stringify(ksData));
  }, 1000);
}

// Start applikasjonen
init();
</script>
</body>
</html>
