<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>Modellkontroll v1.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg:        #f3f4f6;      
      --surface:   #ffffff;      
      --surface2:  #e5e7eb;      
      --border:    #d1d5db;      
      --ink:       #111827;      
      --muted:     #6b7280;      
      
      --green:     #166534;      
      --green-dim: #dcfce7;
      --blue:      #1d4ed8;      
      --blue-dim:  #dbeafe;
      
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg); color: var(--ink); font-family: var(--sans);
      height: 100%; display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }

    .header-title { flex: 1; }
    .header-title h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header-title h1 .version { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
    .header-title p { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }

    .btn { font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; transition: opacity .15s; }
    .btn:not(:disabled):hover { opacity: .85; }
    .btn-primary { background: var(--blue); color: #ffffff; }
    .btn-secondary { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); }
    .btn-small { font-size: 11px; padding: 5px 10px; border-radius: 4px; }
    
    #filterBar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 15px; align-items: center; flex-shrink: 0; }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-group label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .filter-group select { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }

    #statusBar { font-family: var(--mono); font-size: 11px; padding: 6px 16px; background: var(--blue-dim); color: var(--blue); border-bottom: 1px solid var(--border); }

    main { flex: 1 1 auto; overflow-y: auto; padding: 16px; }

    /* Sjekkliste UI */
    .report-container { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
    .report-header { border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 20px; }
    
    .sjekk-panel { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
    .sjekk-header { background: var(--surface2); padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
    .sjekk-header input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; }
    .sjekk-tittel { font-size: 14px; font-weight: 600; flex: 1; }
    
    .sjekk-body { padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
    .sjekk-body textarea { width: 100%; min-height: 60px; font-family: var(--sans); font-size: 13px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; resize: vertical; }
    
    .bilde-container { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .screenshot-img { max-width: 100%; max-height: 300px; border: 1px solid var(--border); border-radius: 4px; display: none; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>Modellkontroll <span class="version">v1.0</span></h1>
    <p>Sjekklister og avvikshåndtering</p>
  </div>
  <button class="btn btn-secondary" onclick="eksporterTilWord()">📝 Eksport Word</button>
  <button class="btn btn-primary" onclick="eksporterTilPDF()">📄 Eksport PDF</button>
</header>

<div id="filterBar">
  <div class="filter-group">
    <label for="fagFilter">Velg Fag:</label>
    <select id="fagFilter">
      <option value="veg">Veg</option>
      <option value="rekkverk">Vegutstyr rekkverk</option>
    </select>
  </div>
</div>

<div id="statusBar">Kobler til Trimble Connect...</div>

<main>
  <div id="reportContent" class="report-container">
    <div class="report-header">
      <h2 id="reportTitle">Modellkontroll: Veg</h2>
      <p style="font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px;" id="reportDate"></p>
    </div>
    
    <div id="sjekklisteContainer">
      </div>
  </div>
</main>

<script>
let API = null;

// Datastruktur for fag og tilhørende sjekkpunkter
const fagsjekkListe = {
  "veg": {
    navn: "Veg",
    punkter: [
      { id: "v1", tekst: "Senterlinje er korrekt plassert iht. tverrprofil" },
      { id: "v2", tekst: "Tverrfall er riktig i kurver og fyllinger" },
      { id: "v3", tekst: "Vegoppbygging (lagtykkelser) stemmer overens med krav" },
      { id: "v4", tekst: "MMI-nivå og koding (prosesskoder) på vegobjekter er lagt inn" }
    ]
  },
  "rekkverk": {
    navn: "Vegutstyr rekkverk",
    punkter: [
      { id: "r1", tekst: "Avstand fra rekkverk til vegkant er iht. regelverk (N101)" },
      { id: "r2", tekst: "Arbeidsbredde på rekkverket er hensyntatt" },
      { id: "r3", tekst: "Rekkverksender er forankret eller har energiabsorberende terminal" },
      { id: "r4", tekst: "Korrekt prosesskode er lagt inn på utstyret" }
    ]
  }
};

// Objekt for å lagre brukerens inndata underveis (så det ikke slettes når man bytter fag)
const lagretData = {};

const $ = id => document.getElementById(id);
const setStatus = m => { $('statusBar').textContent = m; };

async function connect(){
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    setStatus('✅ Tilkoblet Trimble Connect.');
  } catch(e) { 
    setStatus('⚠️ Kjører utenfor Trimble Connect (Skjermbilde-testmodus).'); 
  }
}

// Generer skjemaet basert på valgt fag
function tegnSjekkliste(fagNokkel) {
  const fagData = fagsjekkListe[fagNokkel];
  $('reportTitle').innerText = `Modellkontroll: ${fagData.navn}`;
  
  const dato = new Date().toLocaleDateString('no-NB', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' });
  $('reportDate').innerText = `Utført: ${dato}`;

  const container = $('sjekklisteContainer');
  container.innerHTML = '';

  fagData.punkter.forEach((punkt, index) => {
    // Initialiser lagring for dette punktet hvis det ikke finnes
    if (!lagretData[punkt.id]) {
      lagretData[punkt.id] = { godkjent: false, kommentar: "", bilde: null };
    }
    const data = lagretData[punkt.id];

    const panel = document.createElement('div');
    panel.className = 'sjekk-panel';

    panel.innerHTML = `
      <div class="sjekk-header">
        <input type="checkbox" id="check_${punkt.id}" ${data.godkjent ? 'checked' : ''}>
        <div class="sjekk-tittel">${index + 1}. ${punkt.tekst}</div>
      </div>
      <div class="sjekk-body">
        <textarea id="kommentar_${punkt.id}" placeholder="Legg til kommentar her...">${data.kommentar}</textarea>
        
        <div class="bilde-container">
          <button class="btn btn-secondary btn-small" onclick="taSkjermbilde('${punkt.id}')">📷 Ta skjermbilde fra 3D-modell</button>
          <img id="bilde_${punkt.id}" class="screenshot-img" src="${data.bilde || ''}" style="display: ${data.bilde ? 'block' : 'none'};">
        </div>
      </div>
    `;
    container.appendChild(panel);

    // Lagre endringer fortløpende
    $(`check_${punkt.id}`).addEventListener('change', (e) => data.godkjent = e.target.checked);
    $(`kommentar_${punkt.id}`).addEventListener('input', (e) => data.kommentar = e.target.value);
  });
}

// Funksjon for å ta skjermbilde
async function taSkjermbilde(punktId) {
  const imgElement = $(`bilde_${punktId}`);
  setStatus('⏳ Tar skjermbilde...');
  
  try {
    if (API && API.viewer) {
      // Kall mot Trimble Connect API
      const bildeBase64 = await API.viewer.getScreenshot(); 
      // Merk: getScreenshot() metoden kan variere litt i returformat avhengig av API-versjon.
      // Den returnerer typisk en 'data:image/png;base64,...' streng.
      imgElement.src = bildeBase64;
      imgElement.style.display = 'block';
      lagretData[punktId].bilde = bildeBase64;
      setStatus('✅ Skjermbilde lagret på punktet.');
    } else {
      throw new Error("Ikke i Trimble");
    }
  } catch (error) {
    // Fallback hvis man tester lokalt i nettleseren (Lager en grå demonstrasjonsboks)
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 300;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#e5e7eb'; ctx.fillRect(0, 0, 600, 300);
    ctx.fillStyle = '#6b7280'; ctx.font = '20px Syne'; ctx.fillText('Demonstrasjonsbilde (Utenfor Trimble)', 120, 150);
    
    const mockImage = canvas.toDataURL('image/png');
    imgElement.src = mockImage;
    imgElement.style.display = 'block';
    lagretData[punktId].bilde = mockImage;
    setStatus('⚠️ Lagt inn test-bilde (Kjører lokalt).');
  }
}

// PDF Eksport
function eksporterTilPDF() {
  const element = $('reportContent');
  const fagNavn = fagsjekkListe[$('fagFilter').value].navn;
  const dato = new Date().toISOString().slice(0, 10);
  
  const opt = {
    margin:       10,
    filename:     `Modellkontroll_${fagNavn}_${dato}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  setStatus('⏳ Genererer PDF...');
  html2pdf().set(opt).from(element).save().then(() => {
    setStatus('✅ PDF eksportert.');
  });
}

// Word Eksport (Enkel HTML til .doc tilnærming)
function eksporterTilWord() {
  const fagNavn = fagsjekkListe[$('fagFilter').value].navn;
  const dato = new Date().toISOString().slice(0, 10);
  
  const content = $('reportContent').innerHTML;
  
  // Bygger en enkel MS Word kompatibel HTML-struktur
  const header = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' 
          xmlns:w='urn:schemas-microsoft-com:office:word' 
          xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>Eksport</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .sjekk-panel { border: 1px solid #ccc; margin-bottom: 15px; padding: 10px; }
      .sjekk-header { font-weight: bold; font-size: 14px; margin-bottom: 10px; }
      textarea { border: none; font-family: Arial; width: 100%; }
      img { max-width: 100%; height: auto; margin-top: 10px; }
      button { display: none; } /* Skjuler knapper i word-dokumentet */
    </style>
    </head><body>
  `;
  const footer = "</body></html>";
  const sourceHTML = header + content + footer;
  
  const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
  const lenke = document.createElement("a");
  
  document.body.appendChild(lenke);
  lenke.href = source;
  lenke.download = `Modellkontroll_${fagNavn}_${dato}.doc`;
  lenke.click();
  document.body.removeChild(lenke);
  
  setStatus('✅ Word-dokument eksportert.');
}

// Lytter for endring av fag i nedtrekksmeny
$('fagFilter').addEventListener('change', (e) => {
  tegnSjekkliste(e.target.value);
});

// Oppstart
connect();
tegnSjekkliste('veg'); // Tegner veg som standard

</script>
</body>
</html>
